# This workflow builds and tests the aws-lambda-java-runtime-interface-client package.
# It runs on every pull request (no path filter) so that the build and
# integration-test required status checks always report a result and never get
# stuck "pending" on PRs that don't touch the RIC/core/serialization paths.

name: PR to runtime-interface-client

on:
  workflow_dispatch:
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read

jobs:

  build-arch:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: "build (${{ matrix.arch }})"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up JDK 1.8
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        java-version: 8
        distribution: corretto
        cache: maven

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        install: true
        # Uses the local image store, so the JNI build reuses the cached base images.
        driver: docker

    - name: Load the JNI build base images
      uses: ./.github/actions/cache-jni-base-images

    - name: Build and install core dependency locally
      working-directory: ./aws-lambda-java-core
      run: mvn clean install

    - name: Build and install serialization dependency locally
      working-directory: ./aws-lambda-java-serialization
      run: mvn clean install

    - name: Test Runtime Interface Client build - Run 'build-${{ matrix.arch }}' target
      working-directory: ./aws-lambda-java-runtime-interface-client
      run: make build-${{ matrix.arch }}
      env:
        IS_JAVA_8: true

    - name: Save the built jar
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: aws-lambda-java-runtime-interface-client-${{ matrix.arch }}
        path: ./aws-lambda-java-runtime-interface-client/target/aws-lambda-java-runtime-interface-client-*.jar

    - name: Upload coverage to Codecov
      if: env.CODECOV_TOKEN != null
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        files: ./aws-lambda-java-runtime-interface-client/target/site/jacoco/jacoco.xml
        flags: ${{ matrix.arch }}
        disable_search: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Runs on the release CodeBuild runners, so base images come from the ECR
  # pull-through cache instead of rate-limited anonymous public.ecr.aws pulls.
  integration-test-matrix:
    runs-on: codebuild-aws-lambda-java-libs-test-trigger-${{ matrix.arch.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      # Run every OS/arch combination to completion so one failure doesn't mask the others.
      fail-fast: false
      # Stays within the account's concurrent CodeBuild build quota.
      max-parallel: 8
      matrix:
        target:
          - { os: alpine, distro: "3.15", runtime: corretto11 }
          - { os: amazoncorretto, distro: amazoncorretto, runtime: "8" }
          - { os: amazoncorretto, distro: amazoncorretto, runtime: "11" }
          - { os: amazonlinux, distro: "1", runtime: openjdk8 }
          - { os: amazonlinux, distro: "2", runtime: openjdk8 }
          - { os: debian, distro: bookworm, runtime: corretto11 }
          - { os: debian, distro: trixie, runtime: corretto11 }
          - { os: ubuntu, distro: "22.04", runtime: corretto11 }
          - { os: ubuntu, distro: "24.04", runtime: corretto11 }
        arch:
          - { label: x64, runner: x86, platform: linux/amd64 }
          - { label: arm64, runner: arm64, platform: linux/arm64/v8 }
        exclude:
          # Amazon Linux 1 has no arm64 image.
          - target: { os: amazonlinux, distro: "1", runtime: openjdk8 }
            arch: { label: arm64, runner: arm64, platform: linux/arm64/v8 }
    name: "integration-test (${{ matrix.target.os }} ${{ matrix.target.distro }} ${{ matrix.target.runtime }} / ${{ matrix.arch.label }})"
    # BASE_REGISTRY is read by the JNI build and run_os_test.sh.
    env:
      AWS_REGION: ${{ vars.AWS_REGION_MAVEN_RELEASE }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION_MAVEN_RELEASE }}.amazonaws.com
      BASE_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION_MAVEN_RELEASE }}.amazonaws.com/ecr-public
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Cache Maven repository
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-maven-

    # The runners can't reach Maven Central or the setup-java JDK downloads.
    - name: Use the runner image's preinstalled Corretto 8
      uses: ./.github/actions/use-runner-corretto8

    - name: Configure Maven CodeArtifact mirror
      uses: ./.github/actions/configure-maven-mirror

    # Uses the runner role's ambient credentials.
    - name: Log in to Amazon ECR (pull-through cache)
      run: |
        aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin "$ECR_REGISTRY"

    - name: Run OS integration test
      run: aws-lambda-java-runtime-interface-client/test/integration/codebuild/scripts/run_os_test.sh
      env:
        OS_DISTRIBUTION: ${{ matrix.target.os }}
        DISTRO_VERSION: ${{ matrix.target.distro }}
        RUNTIME_VERSION: ${{ matrix.target.runtime }}
        PLATFORM: ${{ matrix.arch.platform }}

  integration-test:
    needs: integration-test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check integration-test results
        run: |
          if [ "${{ needs.integration-test-matrix.result }}" != "success" ]; then
            echo "Integration tests failed on one or more OS/arch combinations"
            exit 1
          fi

  build:
    needs: build-arch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build-arch.result }}" != "success" ]; then
            echo "Build failed on one or more architectures"
            exit 1
          fi
