# Not used by the GitHub PR workflow (.github/workflows/runtime-interface-client_pr.yml).
version: 0.2

env:
  variables:
    OS_DISTRIBUTION: amazoncorretto
    DOCKER_CLI_EXPERIMENTAL: "enabled"
    DOCKER_CLI_PLUGIN_DIR: "/root/.docker/cli-plugins"
batch:
  build-matrix:
    static:
      ignore-failure: false
      env:
        privileged-mode: true
    dynamic:
      env:
        variables:
          DISTRO_VERSION:
            - "amazoncorretto"
          RUNTIME_VERSION:
            - "8"
            - "11"
          PLATFORM:
            - "linux/amd64"
            - "linux/arm64/v8"
phases:
  install:
    commands:
      - >
        if [[ -z "${DOCKERHUB_USERNAME}" && -z "${DOCKERHUB_PASSWORD}" ]];
        then
            echo "DockerHub credentials not set as CodeBuild environment variables. Continuing without docker login."
        else
            echo "Performing DockerHub login . . ."
            docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
        fi
      - aws-lambda-java-runtime-interface-client/test/integration/codebuild/scripts/configure_multi_arch_env.sh
  build:
    commands:
      - aws-lambda-java-runtime-interface-client/test/integration/codebuild/scripts/run_os_test.sh
