name: Cache the JNI build base images
description: >
  Load the JNI build base images into the local Docker image store from the
  Actions cache, pulling them from public.ecr.aws only on a cache miss. The JNI
  build then reuses them, provided buildx uses the docker driver.

runs:
  using: composite
  steps:
    # Weekly key, so the images are refreshed once a week.
    - id: key
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/jni-base-images.tar
        key: jni-base-images-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.week }}

    # Pulls on a cache miss, or when the cached tar can't be loaded.
    - shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        TAR: ${{ runner.temp }}/jni-base-images.tar
      run: |
        if [[ "$CACHE_HIT" == "true" ]] && docker load -i "$TAR"; then
          exit 0
        fi
        images="public.ecr.aws/amazonlinux/amazonlinux:2 public.ecr.aws/docker/library/alpine:3"
        for image in $images; do
          aws-lambda-java-runtime-interface-client/test/integration/codebuild/scripts/docker-retry.sh docker pull "$image"
        done
        docker save -o "$TAR" $images
